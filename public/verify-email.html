<!doctype html>
<html lang="en" data-type="software" data-radius="soft" data-buttons="solid" data-motion>
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>Verify your email | Chirpy</title>
    <meta name="description" content="Confirm the email address used to create your Chirpy account.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Verify your email | Chirpy">
    <meta property="og:description" content="Confirm the email address used to create your Chirpy account.">
    <meta property="og:image" content="./assets/logo.png">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="site-kind" content="software">
    <meta name="page-type" content="software">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="./assets/logo.png" type="image/png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400..700&family=JetBrains+Mono:wght@400..500&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./assets/system.css">
    <link rel="stylesheet" href="./assets/motion/motion.css">
    <link rel="stylesheet" href="./assets/layout/layout.css">
    <link rel="stylesheet" href="./styles/theme.css">
    <link rel="stylesheet" href="./styles/auth.css">
    <script>
      document.documentElement.classList.add("m-enter");
      setTimeout(() => document.documentElement.classList.add("m-enter-done"), 700);
    </script>
  </head>
  <body class="auth-body">
    <header class="auth-header">
      <div class="wrap auth-header__inner">
        <a class="skip-link" href="#verify-main">Skip to content</a>
        <a class="auth-brand" href="./index.html" aria-label="Chirpy home">
          <img src="./assets/logo.png" alt="" width="44" height="44">
          <span>Chirpy</span>
        </a>
        <nav class="auth-header__nav" aria-label="Primary navigation">
          <a class="auth-header__nav-link" href="./posts.html">Reviews</a>
          <a class="auth-header__nav-link" href="./university-reviews.html">
            <span class="auth-header__nav-full">University ratings</span>
            <span class="auth-header__nav-short">Ratings</span>
          </a>
          <a class="auth-header__nav-link" href="./rate-university.html">Rate</a>
          <a class="auth-header__nav-link auth-header__nav-link--active" href="./index.html" aria-current="page">Account</a>
          <a class="auth-header__nav-link" href="./admin.html">Admin</a>
        </nav>
        <span class="auth-header__label">University Review System</span>
      </div>
    </header>

    <main id="verify-main">
      <section class="hero auth-screen auth-verify" data-enter aria-labelledby="verify-title">
        <div class="wrap">
          <div class="verify-email-content">
            <p class="auth-kicker auth-kicker--dark">Account email</p>
            <h1 id="verify-title">Verify your email address</h1>
            <p>Confirm the email address you used to sign up. This does not verify your university affiliation.</p>
            <button class="btn btn--primary" id="verify-email-button" type="button">Verify email address</button>
            <p class="form__status" id="verify-email-status" role="status" aria-live="polite"></p>
            <a class="link" href="./index.html">Return to sign in</a>
          </div>
        </div>
      </section>
    </main>

    <script type="module" src="./assets/system.js"></script>
    <script type="module" src="./assets/motion/motion.js"></script>
    <script type="module" src="./scripts/verify-email-page.js"></script>
  </body>
</html>
